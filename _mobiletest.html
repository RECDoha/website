<!doctype html>
<html><head><meta charset="utf-8"><title>overflow probe</title>
<style>body{font:13px/1.5 monospace;background:#111;color:#eee;margin:0;padding:10px}
iframe{border:0;position:absolute;left:-9999px;top:0}
td{padding:2px 10px;border-bottom:1px solid #333}.bad{color:#ff6b6b;font-weight:700}.ok{color:#5ddb7a}</style>
</head><body>
<table id="out"></table>
<script>
const pages = ["index","about","syllabi","cambridge","edexcel","events","testimonials","faq","contact","register"];
const widths = [390, 360, 768];
const out = document.getElementById("out");

function probe(page, w) {
  return new Promise(res => {
    const f = document.createElement("iframe");
    f.width = w; f.height = 900; f.src = page + ".html";
    f.onload = () => {
      const d = f.contentDocument;
      const sw = d.documentElement.scrollWidth;
      const cw = d.documentElement.clientWidth;
      // widest offending element, if any
      let worst = null, worstR = 0;
      if (sw > cw + 1) {
        d.querySelectorAll("*").forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.right > cw + 1 && r.right > worstR && r.width > 0) {
            worstR = r.right;
            worst = el.tagName.toLowerCase() +
              (el.className && typeof el.className === "string" ? "." + el.className.trim().split(/\s+/).join(".") : "");
          }
        });
      }
      res({page, w, sw, cw, worst, worstR: Math.round(worstR)});
      f.remove();
    };
    document.body.appendChild(f);
  });
}

(async () => {
  for (const w of widths) {
    for (const p of pages) {
      const r = await probe(p, w);
      const over = r.sw - r.cw;
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + r.w + "px</td><td>" + r.page + "</td>" +
        "<td class='" + (over > 1 ? "bad" : "ok") + "'>" +
        (over > 1 ? "OVERFLOW +" + over + "px" : "ok") + "</td>" +
        "<td>" + (r.worst ? r.worst + " → right:" + r.worstR : "") + "</td>";
      out.appendChild(tr);
    }
  }
  document.title = "done";
})();
</script>
</body></html>
